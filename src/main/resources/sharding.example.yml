dataSources:
  shardedwallet1:
    jdbcUrl: jdbc:mysql://$${DB_HOST::localhost}:$${DB_PORT::3306}/shardedwallet1
    username: $${DB_USERNAME::root}
    password: '$${DB_PASSWORD::changeme}'
    driverClassName: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource

  shardedwallet2:
    jdbcUrl: jdbc:mysql://$${DB_HOST::localhost}:$${DB_PORT::3306}/shardedwallet2
    username: $${DB_USERNAME::root}
    password: '$${DB_PASSWORD::changeme}'
    driverClassName: com.mysql.cj.jdbc.Driver
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource

rules:
  - !SHARDING
    defaultDatabaseStrategy:
      standard:
        shardingColumn: id
        shardingAlgorithmName: db-inline

    tables:
      user:
        actualDataNodes: shardedwallet$->{1..2}.user
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      wallet:
        actualDataNodes: shardedwallet$->{1..2}.wallet
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      transaction:
        actualDataNodes: shardedwallet$->{1..2}.transaction
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      saga_instance:
        actualDataNodes: shardedwallet$->{1..2}.saga_instance
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      saga_step:
        actualDataNodes: shardedwallet$->{1..2}.saga_step
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

    shardingAlgorithms:
      db-inline:
        type: INLINE
        props:
          algorithm-expression: shardedwallet$->{id % 2 + 1}

    keyGenerators:
      snowflakestrategy:
        type: SNOWFLAKE
